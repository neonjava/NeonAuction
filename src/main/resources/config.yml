# NeonAH - Modern Auction House Configuration
# Supports MiniMessage (Gradients, Hex Colors, Hover, etc.)

settings:
  # The duration an item stays in the auction house (in seconds)
  # Default: 86400 (24 hours)
  expiry-duration: 86400
  
  # How long to keep history logs (in days)
  history-keep-days: 7
  
  # License key (for premium features)
  license-key: "NEON-AHHH-0000"

# Modern Color Palettes & UI Titles
gui:
  main-menu:
    title: "<gradient:#8fd3f4:#84fab0><bold>ᴀᴜᴄᴛɪᴏɴ ʜᴏᴜѕᴇ</bold></gradient>"
    size: 54
  confirm-buy:
    title: "<gradient:#ff9a9e:#fecfef><bold>ᴄᴏɴꜰɪʀᴍ ᴘᴜʀᴄʜᴀѕᴇ</bold></gradient>"
    size: 27
  shulker-preview:
    title: "<gradient:#a18cd1:#fbc2eb><bold>ѕʜᴜʟᴋᴇʀ ᴘʀᴇᴠɪᴇᴡ</bold></gradient>"
    size: 36
  unclaimed-items:
    title: "<gradient:#cfd9df:#e2ebf0><bold>ᴜɴᴄʟᴀɪᴍᴇᴅ ɪᴛᴇᴍѕ</bold></gradient>"
    size: 54

# Items that are blocked from being listed
# Logic: If item name contains any of these strings, it's blocked.
# UNLESS it matches a whitelisted name below.
blocked-names:
  - "renamed"
  - "fake"

# These names are ALWAYS allowed even if they contain blocked strings
allowed-custom-names:
  - "<gradient:#ff0844:#ffb199>Amethyst Sword</gradient>"
  - "<gradient:#ff0844:#ffb199>Amethyst Pickaxe</gradient>"
  - "Smart Spawner"

# Permission-based limits (number of active listings)
limits:
  default: 3
  vip: 5
  mvp: 10
  owner: 50

messages:
  prefix: "<gradient:#84fab0:#8fd3f4><bold>[AH]</bold></gradient> "
  
  # Formatting for auction listings
  item-listed: "<green>Item successfully listed for <yellow>%compact%<green>!"
  invalid-price: "<red>Invalid price! Use numbers or suffixes like 10k, 1m."
  hold-item: "<red>You must be holding an item to sell it!"
  renamed-blocked: "<red>Renamed items (or containers with them) cannot be auctioned!"
  at-inventory-full: "<red>Your inventory is full! Please make space."
  item-already-bought: "<red>This item has already been purchased or removed."
  insufficient-funds: "<red>You do not have enough money to buy this item."
  purchase-success: "<green>You successfully bought the item!"
  listing-removed: "<yellow>Listing successfully removed and returned."
  inventory-full-returns: "<yellow>Inventory full! Items moved to /ah unclaimed."
  
  # Global broadcasts
  global-broadcast: "<gradient:#84fab0:#8fd3f4><bold>[AH]</bold></gradient> <gray>%name% listed <white>%item% <gray>for <yellow>%price%<gray>!"
  buy-broadcast: "<gradient:#84fab0:#8fd3f4><bold>[AH]</bold></gradient> <gray>%buyer% <white>purchased <white>%item% <gray>from <white>%seller% <gray>for <yellow>%price%<gray>!"
  
  lore:
    price: "<gray>ᴘʀɪᴄᴇ: <yellow>%price%"
    cancel: "<red>» Click to Cancel Listing"
    reclaim: "<green>» Click to Reclaim All"
    force-remove: "<red>» Click to Force Remove"
    preview: "<light_purple>» Click to Preview Contents"
    purchase: "<green>» Click to Purchase"

# Icon settings for buttons
icons:
  next-page:
    material: ARROW
    name: "<gradient:#8fd3f4:#84fab0>ɴᴇxᴛ ᴘᴀɢᴇ</gradient>"
    lore:
      - "<gray>Click to view more items"
  prev-page:
    material: ARROW
    name: "<gradient:#8fd3f4:#84fab0>ᴘʀᴇᴠɪᴏᴜѕ ᴘᴀɢᴇ</gradient>"
    lore:
      - "<gray>Click to go back"
  refresh:
    material: SUNFLOWER
    name: "<gradient:#fccb90:#d57eeb>ʀᴇꜰʀᴇѕʜ</gradient>"
    lore:
      - "<gray>Click to update listings"
  search:
    material: COMPASS
    name: "<gradient:#a1c4fd:#c2e9fb>ѕᴇᴀʀᴄʜ</gradient>"
    lore:
      - "<gray>Click to search by name/user"
  sort:
    material: HOPPER
    name: "<gradient:#cfd9df:#e2ebf0>ѕᴏʀᴛ ɪᴛᴇᴍѕ</gradient>"
    lore:
      - "<gray>Current: <white>%sort_mode%"
      - "<gray>Click to cycle sort modes"
