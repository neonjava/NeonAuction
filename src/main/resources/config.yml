# NeonAH Config
compact-price: true
allow-custom-named-items: true # Whether to allow items with custom display names to be sold
allowed-custom-names:
  - "SHARD BOOSTER"
  - "AMETHYST"
  - "SPAWNER"
# Add common keywords that identify special SMP items

# Listing limits per permission node
limits:
